version: "3.5"

services:
  server:
    image: ghcr.io/animo/openid4vc-playground/agent:main
    deploy:
      placement:
        constraints:
          - node.role == worker
          - node.labels.type == community
      labels:
        traefik.enable: "true"

        traefik.http.routers.openid4vc-server.rule: Host(`playground.animo.id`) && (PathPrefix(`/api`) || PathPrefix(`/oid4vci`) || PathPrefix(`/oid4vp`) || PathPrefix(`/provider`) || PathPrefix(`/.well-known`) || PathPrefix(`/crl`) || PathPrefix(`/payments-credential-metadata`))
        traefik.http.routers.openid4vc-server.entrypoints: web-secure
        traefik.http.routers.openid4vc-server.tls.certresolver: zerossl
        traefik.http.routers.openid4vc-server.service: openid4vc-server-service
        traefik.http.services.openid4vc-server-service.loadbalancer.server.port: 3001

    environment:
      AGENT_HOST: "https://playground.animo.id"
      AGENT_WALLET_KEY: ${AGENT_WALLET_KEY}
      ROOT_P256_SEED: ${ROOT_P256_SEED}
      DCS_P256_SEED: ${DCS_P256_SEED}
      X509_ROOT_CERTIFICATE: ${X509_ROOT_CERTIFICATE}
      X509_DCS_CERTIFICATE: ${X509_DCS_CERTIFICATE}

    networks:
      - traefik

  client:
    image: ghcr.io/animo/openid4vc-playground/app:main
    deploy:
      placement:
        constraints:
          - node.role == worker
          - node.labels.type == community
      labels:
        traefik.enable: "true"
        traefik.http.routers.openid4vc-app.rule: Host(`playground.animo.id`) && !PathPrefix(`/oid4vci`) && !PathPrefix(`/oid4vp`) && !PathPrefix(`/api`) && !PathPrefix(`/provider`) && !PathPrefix(`/payments-credential-metadata`) && !PathPrefix(`/crl`)
        traefik.http.routers.openid4vc-app.entrypoints: web-secure
        traefik.http.routers.openid4vc-app.tls.certresolver: zerossl
        traefik.http.routers.openid4vc-app.service: openid4vc-app-service
        traefik.http.services.openid4vc-app-service.loadbalancer.server.port: 80

        # The playground used to run on eudi-payments.animo.id, so its links keep working
        traefik.http.routers.eudi-payments-redirect.rule: Host(`eudi-payments.animo.id`)
        traefik.http.routers.eudi-payments-redirect.entrypoints: web-secure
        traefik.http.routers.eudi-payments-redirect.tls.certresolver: zerossl
        traefik.http.routers.eudi-payments-redirect.middlewares: eudi-payments-redirect
        traefik.http.routers.eudi-payments-redirect.service: openid4vc-app-service
        traefik.http.middlewares.eudi-payments-redirect.redirectregex.regex: ^https://eudi-payments\.animo\.id/(.*)
        traefik.http.middlewares.eudi-payments-redirect.redirectregex.replacement: https://playground.animo.id/$${1}
        traefik.http.middlewares.eudi-payments-redirect.redirectregex.permanent: "true"
      update_config:
        monitor: 30s
        delay: 10s
        order: start-first
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: traefik
