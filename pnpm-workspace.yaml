packages:
  - agent
  - app

allowBuilds:
  '@openwallet-foundation/askar-nodejs': true
  cbor-extract: false
  esbuild: false
  koffi: true
  sharp: false

ignoredBuiltDependencies:
  - es5-ext
  - esbuild
  - sharp

overrides:
  # 2.0.1 is a broken publish: the tarball ships only src/*.ts, but package.json
  # still points main at ./bundles/index.umd.js, so Node cannot resolve it.
  json-canonicalize: 2.0.0

minimumReleaseAgeExclude:
  - '@owf/mdoc@0.8.0-alpha-20260829141538'
  - '@credo-ts/askar@0.7.1-pr-2922-20260829144742'
  - '@credo-ts/core@0.7.1-pr-2922-20260829144742'
  - '@credo-ts/didcomm@0.7.1-pr-2922-20260829144742'
  - '@credo-ts/node@0.7.1-pr-2922-20260829144742'
  - '@credo-ts/openid4vc@0.7.1-pr-2922-20260829144742'

onlyBuiltDependencies:
  - '@2060.io/ffi-napi'
  - '@2060.io/ref-napi'
  - '@biomejs/biome'
  - '@openwallet-foundation/askar-nodejs'
