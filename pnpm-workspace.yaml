packages:
  - agent
  - app

allowBuilds:
  '@openwallet-foundation/askar-nodejs': true
  cbor-extract: false
  esbuild: false
  koffi: true
  sharp: false

ignoredBuiltDependencies:
  - es5-ext
  - esbuild
  - sharp

minimumReleaseAgeExclude:
  - '@credo-ts/askar@0.8.0-alpha-20261103114620'
  - '@credo-ts/core@0.8.0-alpha-20261103114620'
  - '@credo-ts/didcomm@0.8.0-alpha-20261103114620'
  - '@credo-ts/node@0.8.0-alpha-20261103114620'
  - '@credo-ts/openid4vc@0.8.0-alpha-20261103114620'
  - '@owf/cose@0.7.0'
  - '@owf/identity-common@0.7.0'
  - '@owf/mdoc@0.9.3'
  - '@owf/token-status-list@0.7.0'
  - '@owf/x509@0.7.0'

# @peculiar/asn1-* >= 2.7.0 ship separate ESM and CJS builds, each with its own schema storage. @peculiar/x509
# always loads as CJS, so ASN.1 classes created from ESM code (e.g. Credo) fail with "Cannot get schema for '<Type>'
# target". Pin to the last versions without an exports map until this is fixed upstream.
# https://github.com/PeculiarVentures/x509/issues/145
#
# @owf/cose registers a global cbor-x decoder for tag 24 with its own DataItem class. @sd-jwt/sd-jwt-vc pulls in an
# older @owf/cose (via @owf/token-status-list) whose registration overrides the one of the version used by @owf/mdoc,
# which then fails to decode mdoc responses with "Expected DataItem". Keep a single version installed.
overrides:
  '@owf/cose': 0.7.0
  '@peculiar/x509': 2.0.0
  '@peculiar/asn1-cms': ~2.6.1
  '@peculiar/asn1-csr': ~2.6.1
  '@peculiar/asn1-ecc': ~2.6.1
  '@peculiar/asn1-pfx': ~2.6.1
  '@peculiar/asn1-pkcs8': ~2.6.1
  '@peculiar/asn1-pkcs9': ~2.6.1
  '@peculiar/asn1-rsa': ~2.6.1
  '@peculiar/asn1-schema': ~2.6.0
  '@peculiar/asn1-x509': ~2.6.1
  '@peculiar/asn1-x509-attr': ~2.6.1

onlyBuiltDependencies:
  - '@2060.io/ffi-napi'
  - '@2060.io/ref-napi'
  - '@biomejs/biome'
  - '@openwallet-foundation/askar-nodejs'

patchedDependencies:
  '@credo-ts/core@0.8.0-alpha-20261103114620': patches/@credo-ts__core@0.8.0-alpha-20261103114620.patch
