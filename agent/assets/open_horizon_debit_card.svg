<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1016" height="640" viewBox="0 0 1016 640">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C3D57"/>
      <stop offset="0.55" stop-color="#1F2A3A"/>
      <stop offset="1" stop-color="#171D27"/>
    </linearGradient>
    <radialGradient id="glow" cx="830" cy="440" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A3A30" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1F2A3A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A4535" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#34352F" stop-opacity="0.85"/>
    </linearGradient>
    <clipPath id="badge">
      <rect x="760" y="56" width="200" height="68" rx="12"/>
    </clipPath>
  </defs>

  <rect width="1016" height="640" fill="url(#background)"/>
  <rect width="1016" height="640" fill="url(#glow)"/>

  <!-- Sun on the horizon, as on the bank's card art -->
  <path d="M580 440 A250 250 0 0 1 1080 440 Z" fill="url(#sun)" stroke="#B39A62" stroke-opacity="0.7" stroke-width="2"/>
  <rect x="584" y="457" width="460" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.07"/>
  <rect x="634" y="491" width="410" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.06"/>
  <rect x="694" y="525" width="302" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.05"/>
  <rect x="754" y="559" width="172" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.04"/>

  <!-- Bank and card name, the card name filled in by the agent per locale -->
  <text x="56" y="92" font-family="sans-serif" font-size="26" font-weight="bold" fill="#F2F4F7">OPEN HORIZON BANK</text>
  <text x="56" y="132" font-family="sans-serif" font-size="24" fill="#F2F4F7" fill-opacity="0.65">{{credential_name}}</text>

  <!-- Masked IBAN, filled in from the credential -->
  <text x="56" y="508" font-family="sans-serif" font-size="18" font-weight="bold" fill="#F2F4F7" fill-opacity="0.55">IBAN</text>
  <text x="56" y="556" font-family="sans-serif" font-size="40" font-weight="bold" fill="#F2F4F7">{{masked_iban}}</text>

  <!-- Wero badge, from the bank's card art -->
  <image x="760" y="56" width="200" height="68" clip-path="url(#badge)" xlink:href="data:image/png;base64,"/>
</svg>
