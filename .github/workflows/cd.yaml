name: Continuous Deployment

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP: app
  AGENT: agent
  STACK_NAME: openid4vc-playground

jobs:
  build-and-push-image-agent:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.AGENT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: "agent/Dockerfile"
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-and-push-image-app:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: ${{ env.APP }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - run: NEXT_PUBLIC_API_URL=https://playground.animo.id pnpm build

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.APP }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Deploys docker-compose.yml to the Swarm, as the services in animo/cloud-setup do
  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push-image-agent, build-and-push-image-app]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Copy stack file to remote
        uses: garygrossgarten/github-action-scp@0.10.0
        with:
          local: docker-compose.yml
          remote: dev/${{ env.STACK_NAME }}/docker-compose.yml
          host: dashboard.dev.animo.id
          username: root
          privateKey: ${{ secrets.DOCKER_SSH_PRIVATE_KEY }}

      - name: Deploy to Docker Swarm
        uses: appleboy/ssh-action@v1.2.5
        env:
          AGENT_WALLET_KEY: ${{ secrets.AGENT_WALLET_KEY }}
          ROOT_P256_SEED: ${{ secrets.ROOT_P256_SEED }}
          DCS_P256_SEED: ${{ secrets.DCS_P256_SEED }}
          X509_ROOT_CERTIFICATE: ${{ secrets.X509_ROOT_CERTIFICATE }}
          X509_DCS_CERTIFICATE: ${{ secrets.X509_DCS_CERTIFICATE }}
        with:
          host: dashboard.dev.animo.id
          username: root
          key: ${{ secrets.DOCKER_SSH_PRIVATE_KEY }}
          envs: AGENT_WALLET_KEY,ROOT_P256_SEED,DCS_P256_SEED,X509_ROOT_CERTIFICATE,X509_DCS_CERTIFICATE
          script: |
            docker stack deploy --compose-file dev/${{ env.STACK_NAME }}/docker-compose.yml ${{ env.STACK_NAME }} --with-registry-auth
